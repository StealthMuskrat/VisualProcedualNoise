plugins {
    id 'application'
}

group = 'dev.visualengine'
version = '0.3.0'
repositories { mavenCentral() }
dependencyLocking { lockAllConfigurations() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

def lwjglVersion = '3.4.3'
def nativePlatform = providers.gradleProperty('nativePlatform').getOrElse(
        System.getProperty('os.name').toLowerCase().contains('win') ? 'natives-windows' :
        System.getProperty('os.name').toLowerCase().contains('mac') ? 'natives-macos' : 'natives-linux')
dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl'].each {
        implementation "org.lwjgl:$it"
        runtimeOnly "org.lwjgl:$it::$nativePlatform"
    }
}
application {
    mainClass = 'dev.visualengine.app.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('wrapper') { gradleVersion = '9.1.0'; distributionType = Wrapper.DistributionType.BIN }
tasks.register('coreCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.visualengine.CoreChecks'
}
tasks.named('check') { dependsOn tasks.named('coreCheck') }
// Contract suites are Java entry points and do not use a JUnit runner.
tasks.named('test') { enabled = false }
tasks.register('gpuCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.visualengine.GpuChecks'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('processResources') { from('licenses') { into 'META-INF/licenses' } }
distributions {
    main { contents { from('THIRD_PARTY_NOTICES.md'); from('licenses') { into 'licenses' }; from('docs') { into 'docs' }; from('examples') { into 'examples' } } }
}
tasks.register('packageWindows', Exec) {
    dependsOn installDist
    doFirst {
        if (!System.getProperty('os.name').toLowerCase().contains('win')) throw new GradleException('Windows app images must be built on Windows with JDK 25.')
        if (nativePlatform != 'natives-windows') throw new GradleException('Windows x64 packaging requires -PnativePlatform=natives-windows')
        def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get().metadata.installationPath.asFile
        delete layout.buildDirectory.dir('package/ProceduralVisualEngine')
        commandLine new File(jdk, 'bin/jpackage.exe'), '--type', 'app-image', '--name', 'ProceduralVisualEngine',
            '--app-version', project.version.toString(), '--dest', layout.buildDirectory.dir('package').get().asFile,
            '--input', layout.buildDirectory.dir('install/procedural-visual-engine/lib').get().asFile,
            '--main-jar', "procedural-visual-engine-${project.version}.jar", '--main-class', application.mainClass.get(),
            '--add-modules', 'java.desktop,java.logging,jdk.unsupported', '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--app-content', 'licenses', '--app-content', 'THIRD_PARTY_NOTICES.md', '--app-content', 'examples'
    }
}
